server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: tradeflow
  datasource:
    url: ${DB_URL:jdbc:h2:mem:tradeflow;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  jackson:
    time-zone: Asia/Shanghai

jwt:
  secret: ${JWT_SECRET:tradeflow-demo-secret-key-change-before-production-2026}
  expiration: 86400000

app:
  demo:
    username: ${DEMO_USERNAME:admin}
    password: ${DEMO_PASSWORD:admin123}
    seed-enabled: ${DEMO_SEED_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

